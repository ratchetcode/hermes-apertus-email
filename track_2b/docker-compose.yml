services:
  hermes:
    image: nousresearch/hermes-agent:latest
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/start-hermes.sh"]
    init: true
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    stdin_open: true
    tty: true
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      HERMES_ENABLE_PROJECT_PLUGINS: "1"
    env_file:
      - .env
    volumes:
      - ./runtime/hermes:/opt/data
      - ./:/workspace:ro