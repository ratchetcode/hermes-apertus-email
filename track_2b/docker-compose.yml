services:
  hermes:
    image: nousresearch/hermes-agent:latest
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/scripts/start-demo.sh"]
    init: true
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - ./runtime/hermes:/opt/data
      - ./:/workspace:ro