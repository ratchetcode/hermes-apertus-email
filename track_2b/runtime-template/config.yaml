# This file bootstraps an isolated project-local Hermes runtime at /opt/data.
# Credentials are supplied only through the untracked Docker env_file (.env).
model:
  default: "${LLM_NAME}"
  provider: custom
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"

agent:
  max_turns: 12
  tool_use_enforcement: true

memory:
  memory_enabled: false
  user_profile_enabled: false

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /workspace
  timeout: 30

# No messaging channel is configured by default. Add one only after an
# explicit deployment decision and operator allowlisting.
